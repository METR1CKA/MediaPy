[project]
name = "mediapy"
version = "3.1.0"
requires-python = ">=3.12"
dependencies = ["yt-dlp>=2026.1.0"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mediapy*"]
