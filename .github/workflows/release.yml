name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb python3-tk
      - run: python -m pip install -e ".[dev]"
      - run: xvfb-run -a python -m pytest

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: mediapy-windows-amd64.exe
            executable: dist/mediapy.exe
            ffmpeg: |
              curl -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
              unzip -o ffmpeg.zip
              mv ffmpeg-*-essentials_build/bin/ffmpeg.exe ffmpeg-bin/
              mv ffmpeg-*-essentials_build/bin/ffprobe.exe ffmpeg-bin/
          - os: macos-15
            asset: mediapy-macos-arm64.zip
            executable: dist/mediapy.app/Contents/MacOS/mediapy
            ffmpeg: |
              base=https://github.com/descriptinc/ffmpeg-ffprobe-static/releases/download/b6.1.2-rc.1
              curl -L -o ffmpeg-bin/ffmpeg "$base/ffmpeg-darwin-arm64"
              curl -L -o ffmpeg-bin/ffprobe "$base/ffprobe-darwin-arm64"
              chmod +x ffmpeg-bin/ffmpeg ffmpeg-bin/ffprobe
          - os: macos-15-intel
            asset: mediapy-macos-intel.zip
            executable: dist/mediapy.app/Contents/MacOS/mediapy
            ffmpeg: |
              curl -L -o ffmpeg.zip https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip
              unzip -o ffmpeg.zip -d ffmpeg-bin
              curl -L -o ffprobe.zip https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip
              unzip -o ffprobe.zip -d ffmpeg-bin
              chmod +x ffmpeg-bin/ffmpeg ffmpeg-bin/ffprobe
          - os: ubuntu-22.04
            asset: mediapy-linux-amd64
            executable: dist/mediapy
            ffmpeg: |
              curl -L -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-lgpl-9.0.tar.xz
              tar -xf ffmpeg.tar.xz
              mv ffmpeg-n9.0-*-linux64-lgpl-*/bin/ffmpeg ffmpeg-bin/
              mv ffmpeg-n9.0-*-linux64-lgpl-*/bin/ffprobe ffmpeg-bin/
              chmod +x ffmpeg-bin/ffmpeg ffmpeg-bin/ffprobe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar tkinter (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tcl tk
      - name: Descargar ffmpeg estático
        shell: bash
        run: |
          mkdir -p ffmpeg-bin
          ${{ matrix.ffmpeg }}
      - name: Construir binario
        run: python -m pip install -e . pyinstaller && pyinstaller mediapy.spec --noconfirm
      - name: Verificar binario
        shell: bash
        run: |
          set +e
          "${{ matrix.executable }}" --selftest
          code=$?
          cat selftest.log || true
          exit $code
      - name: Preparar asset
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            ditto -c -k --keepParent dist/mediapy.app "${{ matrix.asset }}"
          else
            mv "${{ matrix.executable }}" "${{ matrix.asset }}"
          fi
      - name: Subir artefacto
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
